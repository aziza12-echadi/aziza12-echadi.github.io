<!DOCTYPE html>
<html lang="de">
<head>

<title>Aziza - Hören Training</title>

<body>

<p>Willkommen! Übe dein Hören für B1 / B2</p>

<div class="box">
<h2>Übung 1 - Alltag</h2>
<p>Höre zu und beantworte die Fragen.</p>
<audio controls src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
<p><b>Frage:</b> Worüber sprechen die Personen?</p>
<button onclick="alert('Richtig! Weiter zur nächsten Übung!')">Antwort prüfen</button>

<div class="box">
<h2>Übung 2 - Arbeit</h2>
<p>Höre genau zu!</p>
<audio controls src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"></audio>
<p><b>Frage:</b> Was ist das Thema?</p>
<button onclick="alert('Super gemacht, Aziza!')">Antwort prüfen</button>
</div>

<p>Made with ❤️ by Aziza</p>
